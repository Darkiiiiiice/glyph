[package]
name = "glyph-frontend"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "glyph_frontend"
path = "src/lib.rs"

[[bin]]
name = "glyph"
path = "src/main.rs"

[dependencies]
glyph-engine = { path = "../engine" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-backend = "0.3"
xkbcommon = { version = "0.7", features = ["wayland"] }
log = "0.4"
pretty_env_logger = "0.5"
wayland-protocols-wlr = "0.3.12"
wayland-scanner = "0.31"
